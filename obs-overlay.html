<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay – Campeonato</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* ══════════════════════════════════════════════
           MODO MINI  ?mode=mini
           Só o placar ao vivo, estilo dark com bandeirinha.
           Tamanho OBS sugerido: 340 × 90  (escala livremente)
        ══════════════════════════════════════════════ */
        body.mode-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .mini-card {
            display: flex;
            align-items: center;
            background: rgba(10,10,14,0.90);
            border-radius: clamp(6px, 1.5vh, 12px);
            overflow: hidden;
            box-shadow: 0 4px 28px rgba(0,0,0,0.7);
            height: 80vh;
            width: calc(100vw - 4vw);
        }

        .mini-team-block {
            display: flex;
            align-items: center;
            gap: clamp(4px, 1.5vw, 10px);
            padding: 0 clamp(8px, 3vw, 18px);
            flex: 1;
            overflow: hidden;
        }

        .mini-team-block.right { flex-direction: row-reverse; }

        .mini-abbr {
            font-size: clamp(10px, 5vw, 22px);
            font-weight: 900;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .mini-name {
            font-size: clamp(7px, 2.5vw, 12px);
            color: rgba(255,255,255,0.45);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-center-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(10px, 4vw, 24px);
            border-left: 1px solid rgba(255,255,255,0.07);
            border-right: 1px solid rgba(255,255,255,0.07);
            flex-shrink: 0;
            gap: clamp(2px, 1vh, 6px);
            height: 100%;
        }

        .mini-digits {
            font-size: clamp(16px, 9vw, 40px);
            font-weight: 900;
            letter-spacing: clamp(2px, 1vw, 6px);
            line-height: 1;
        }

        .live-dot {
            font-size: clamp(6px, 2vw, 10px);
            font-weight: 700;
            color: #fc8181;
            letter-spacing: 1.5px;
            animation: blink 1.5s infinite;
        }

        .mini-no-live {
            background: rgba(10,10,14,0.85);
            border-radius: clamp(6px, 1.5vh, 12px);
            padding: clamp(8px, 3vw, 18px) clamp(12px, 5vw, 28px);
            font-size: clamp(9px, 3vw, 14px);
            color: rgba(255,255,255,0.25);
            font-style: italic;
        }

        /* ══════════════════════════════════════════════
           MODO CORNER  ?mode=corner
           Tabela de classificação estilo live ranking.
           Tamanho OBS sugerido: 300 × 580  (escala livremente)
        ══════════════════════════════════════════════ */
        body.mode-corner {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            width: 100vw;
            height: 100vh;
            padding: clamp(6px, 2vw, 12px);
        }

        .corner-wrap { width: calc(100vw - clamp(12px, 4vw, 24px)); }

        .corner-panel {
            background: #0d1117;
            border-radius: clamp(4px, 1.5vw, 10px);
            overflow: hidden;
            border: 1px solid #21262d;
            box-shadow: 0 4px 28px rgba(0,0,0,0.7);
        }

        /* cabeçalho das colunas */
        .c-thead {
            display: grid;
            grid-template-columns: 8% 1fr 22% 10% 12%;
            align-items: center;
            padding: clamp(4px, 1.5vh, 9px) clamp(6px, 2vw, 12px);
            border-bottom: 1px solid #21262d;
            gap: clamp(2px, 1vw, 5px);
        }

        .c-th {
            font-size: clamp(6px, 2vw, 9px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8b949e;
            text-align: center;
        }

        .c-th.left  { text-align: left; padding-left: clamp(5px, 2vw, 12px); }
        .c-th.right { text-align: right; }

        /* linha de dados */
        .c-row {
            display: grid;
            grid-template-columns: 8% 1fr 22% 10% 12%;
            align-items: center;
            padding: 0 clamp(6px, 2vw, 12px);
            gap: clamp(2px, 1vw, 5px);
            height: clamp(22px, 5vh, 38px);
            border-bottom: 1px solid #21262d;
        }

        /* zonas — só bordas separadoras, sem background */
        .c-row.zone-q-border { border-bottom: 2px solid rgba(63,185,80,0.4); }
        .c-row.zone-pi-border{ border-bottom: 2px solid rgba(210,153,34,0.4); }

        /* posição colorida por zona */
        .c-pos          { font-size: clamp(8px, 2.5vw, 13px); font-weight:700; color:#8b949e; text-align:center; }
        .c-pos.q        { color: #3fb950; }
        .c-pos.pi       { color: #d29922; }
        .c-pos.out      { color: #f85149; }

        /* pill + nome */
        .c-team {
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .c-name {
            font-size: clamp(8px, 2.5vw, 13px);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #e6edf3;
        }

        .c-row.zone-out .c-name { opacity: 0.6; }

        /* barrinhas de histórico */
        .c-status { display:flex; align-items:center; justify-content:center; gap: clamp(1px, 0.5vw, 3px); }
        .c-bar    { width: clamp(5px, 1.5vw, 10px); height: clamp(8px, 2vh, 14px); border-radius: 2px; }

        /* vitórias */
        .c-num { font-size: clamp(8px, 2.5vw, 13px); font-weight:700; text-align:center; color:#8b949e; }

        /* pontos — azul primário do app */
        .c-pts-val { font-size: clamp(9px, 2.8vw, 14px); font-weight:800; text-align:right; color:#58a6ff; }

        /* rodapé */
        .panel-footer {
            padding: clamp(5px, 1.5vh, 10px) clamp(6px, 2vw, 12px);
            border-top: 1px solid #21262d;
            font-size: clamp(7px, 2vw, 11px);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8b949e;
        }

        /* ══════════════════════════════════════════════
           MODO TABLE  ?mode=table
           Só a tabela de classificação, grande.
           Tamanho OBS sugerido: 860 × 560  (escala livremente)
        ══════════════════════════════════════════════ */
        body.mode-table {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .table-wrap { width: 96vw; }

        /* ══════════════════════════════════════════════
           MODO FULL  ?mode=full
           Placar grande + tabela completa.
           Tamanho OBS sugerido: 860 × 700  (escala livremente)
        ══════════════════════════════════════════════ */
        body.mode-full {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .full-wrap {
            width: 96vw;
            display: flex;
            flex-direction: column;
            gap: clamp(8px, 2vh, 18px);
        }

        /* placar full — dark com bandeirinha */
        .full-scoreboard {
            background: rgba(10,10,14,0.90);
            border-radius: clamp(8px, 2vh, 16px);
            overflow: hidden;
            box-shadow: 0 6px 40px rgba(0,0,0,0.65);
            display: flex;
            align-items: stretch;
            height: clamp(80px, 18vh, 160px);
        }

        .full-team-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 clamp(12px, 3.5vw, 36px);
            gap: clamp(3px, 0.8vh, 8px);
        }

        .full-team-block.right {
            align-items: flex-end;
            text-align: right;
        }

        .full-team-abbr {
            font-size: clamp(16px, 3.5vw, 36px);
            font-weight: 900;
            line-height: 1;
        }

        .full-team-name {
            font-size: clamp(9px, 1.5vw, 14px);
            color: rgba(255,255,255,0.45);
            font-weight: 500;
        }

        .full-score-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 clamp(16px, 4.5vw, 44px);
            flex-shrink: 0;
            gap: clamp(4px, 1vh, 10px);
            border-left: 1px solid rgba(255,255,255,0.06);
            border-right: 1px solid rgba(255,255,255,0.06);
        }

        .full-digits {
            display: flex;
            align-items: center;
            gap: clamp(6px, 1.5vw, 14px);
            font-size: clamp(28px, 8vw, 80px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: 2px;
        }

        .full-sep {
            font-size: clamp(16px, 4vw, 40px);
            font-weight: 300;
            color: rgba(255,255,255,0.2);
        }

        .full-live-badge {
            background: #9b1c1c;
            font-size: clamp(7px, 1.2vw, 11px);
            font-weight: 800;
            padding: clamp(2px, 0.5vh, 4px) clamp(6px, 1.5vw, 14px);
            border-radius: 4px;
            letter-spacing: 2.5px;
            animation: blink 1.5s infinite;
        }

        .full-pen {
            font-size: clamp(8px, 1.2vw, 12px);
            color: rgba(255,255,255,0.3);
        }

        .full-awaiting {
            background: rgba(10,10,14,0.85);
            border-radius: clamp(8px, 2vh, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            height: clamp(50px, 12vh, 100px);
            color: rgba(255,255,255,0.15);
            font-size: clamp(10px, 2vw, 15px);
            font-style: italic;
        }

        /* tabela full */
        .full-table-wrap {
            background: rgba(10,10,14,0.88);
            border-radius: clamp(8px, 2vh, 16px);
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }

        .full-table-header {
            padding: clamp(6px, 1.5vh, 12px) clamp(10px, 2vw, 20px);
            font-size: clamp(7px, 1.2vw, 11px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(10px, 1.5vw, 14px);
        }

        thead th {
            padding: clamp(4px, 1vh, 9px) clamp(6px, 1.5vw, 14px);
            text-align: center;
            font-size: clamp(7px, 1vw, 10px);
            font-weight: 700;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        thead th.tleft { text-align: left; }

        tbody tr { border-top: 1px solid rgba(255,255,255,0.035); }
        tbody tr.zone-q  { background: rgba(72,187,120,0.06); }
        tbody tr.zone-pi { background: rgba(246,173,85,0.04); }

        tbody td {
            padding: clamp(4px, 1vh, 9px) clamp(6px, 1.5vw, 14px);
            text-align: center;
        }

        tbody td.tleft { text-align: left; }
        tbody td.muted { color: rgba(255,255,255,0.3); }

        /* bandeirinha na tabela full */
        .t-flag {
            display: inline-block;
            width: 4px;
            height: clamp(10px, 1.8vh, 16px);
            border-radius: 2px;
            vertical-align: middle;
            margin-right: clamp(5px, 1.2vw, 11px);
            flex-shrink: 0;
        }

        .t-name { font-weight: 700; vertical-align: middle; }
        .t-pts  { font-weight: 900; font-size: clamp(11px, 1.8vw, 16px); }

        /* bracket full */
        .bracket-wrap { padding: clamp(8px, 2vw, 18px); display: flex; flex-direction: column; gap: clamp(8px, 2vh, 18px); }

        .bracket-phase-label {
            font-size: clamp(7px, 1.2vw, 11px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.28);
            margin-bottom: clamp(4px, 1vh, 8px);
        }

        .bracket-grid { display: grid; gap: clamp(3px, 0.8vh, 7px); }

        .bm {
            display: flex;
            align-items: center;
            border-radius: clamp(4px, 1vw, 8px);
            overflow: hidden;
            font-size: clamp(10px, 1.5vw, 15px);
            background: rgba(255,255,255,0.03);
        }

        .bm-team {
            flex: 1;
            padding: clamp(5px, 1.2vh, 10px) clamp(8px, 1.5vw, 14px);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: clamp(4px, 1vw, 9px);
            overflow: hidden;
        }

        .bm-team.right { flex-direction: row-reverse; }

        .bm-flag {
            width: 4px;
            height: clamp(10px, 1.8vh, 16px);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .bm-score {
            background: rgba(255,255,255,0.07);
            padding: clamp(5px, 1.2vh, 10px) clamp(10px, 2vw, 18px);
            font-weight: 900;
            font-size: clamp(11px, 1.8vw, 17px);
            min-width: clamp(40px, 7vw, 70px);
            text-align: center;
            flex-shrink: 0;
        }

        .winner-text { color: #68d391; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getFirestore, collection,
                 doc, onSnapshot,
                 connectFirestoreEmulator } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey:            'AIzaSyDKPy8Q8BNGUqGZ-DFIGyjguS7ZD_r9V8Q',
            authDomain:        'organizador-de-campeonato.firebaseapp.com',
            projectId:         'organizador-de-campeonato',
            storageBucket:     'organizador-de-campeonato.firebasestorage.app',
            messagingSenderId: '574392149055',
            appId:             '1:574392149055:web:75225d6719270b6b4dc48a',
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        // Mesmo hookup de emulador do app.js — ativa em localhost ou IP da rede local
        if (['localhost', '127.0.0.1'].includes(location.hostname)
            || /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname)) {
            connectFirestoreEmulator(db, location.hostname, 8080);
        }

        /* ── URL params ── */
        const params   = new URLSearchParams(location.search);
        // mini | corner | full | table
        const MODE     = params.get('mode') || 'mini';
        // standings | bracket  (usado nos modos corner e full)
        const TABLE    = params.get('table') || 'standings';
        const MAX_ROWS = parseInt(params.get('rows') || '12', 10);
        const DEMO     = params.has('demo');

        /* ── Regras de set ──
           Semis, disputa de 3º lugar e final são melhor de 3 sets: os dois primeiros
           vão até 21 pontos e o decisivo até 15, sempre com 2 de vantagem e sem teto.
           gols1/gols2 guardam os sets ganhos; o array `sets` guarda os pontos de cada set.
           (declarado aqui em cima porque o modo demo já renderiza logo abaixo) */
        const SET_PHASES  = ['semis','terceiro','final'];
        const SET_TARGETS = [21, 21, 15];
        const isSetPhase  = f => SET_PHASES.includes(f);

        function setWinner(p1, p2, i) {
            const target = SET_TARGETS[i] ?? SET_TARGETS[SET_TARGETS.length-1];
            if (p1 >= target && p1 - p2 >= 2) return 1;
            if (p2 >= target && p2 - p1 >= 2) return 2;
            return 0;
        }

        function setsOf(m) {
            return Array.isArray(m?.sets)
                ? m.sets.slice(0, SET_TARGETS.length).map(s => ({ p1: s?.p1 ?? 0, p2: s?.p2 ?? 0 }))
                : [];
        }

        function setsSummary(m) {
            const list = setsOf(m);
            let won1 = 0, won2 = 0;
            list.forEach((s, i) => {
                const w = setWinner(s.p1, s.p2, i);
                if (w === 1) won1++; else if (w === 2) won2++;
            });
            return { list, won1, won2, text: list.map(s => `${s.p1}-${s.p2}`).join(' · ') };
        }

        document.body.classList.add('mode-' + MODE);

        /* ── State ── */
        const state = {
            liveMatch: null,
            matches:   [],
            knockout:  [],
            teams:     [],
            config:    {},
        };

        /* ══════════════════════════════════════════
           DEMO — dados falsos, sem conexão Firebase
        ══════════════════════════════════════════ */
        if (DEMO) {
            const DEMO_TEAMS = [
                { nome: 'Flamengo',      sigla: 'FLA', cor: '#e31e25', cores: ['#e31e25', '#000000'] },
                { nome: 'Palmeiras',     sigla: 'PAL', cor: '#006437', cores: ['#006437'] },
                { nome: 'Atlético-MG',   sigla: 'CAM', cor: '#000000', cores: ['#000000', '#ffffff'] },
                { nome: 'Fluminense',    sigla: 'FLU', cor: '#8b0000', cores: ['#8b0000', '#6db33f', '#6b4226'] },
                { nome: 'Corinthians',   sigla: 'COR', cor: '#555555', cores: ['#000000', '#ffffff'] },
                { nome: 'São Paulo',     sigla: 'SPF', cor: '#cc0000', cores: ['#cc0000', '#ffffff', '#000000'] },
                { nome: 'Grêmio',        sigla: 'GRE', cor: '#3b6fb5', cores: ['#3b6fb5', '#000000', '#6dc4d8'] },
                { nome: 'Internacional', sigla: 'INT', cor: '#cc0000', cores: ['#cc0000'] },
                { nome: 'Vasco',         sigla: 'VAS', cor: '#555555', cores: ['#000000', '#ffffff'] },
                { nome: 'Botafogo',      sigla: 'BOT', cor: '#555555', cores: ['#000000', '#ffffff'] },
                { nome: 'Santos',        sigla: 'SAN', cor: '#555555', cores: ['#000000', '#ffffff'] },
                { nome: 'Cruzeiro',      sigla: 'CRU', cor: '#0033a0', cores: ['#0033a0'] },
            ];
            state.teams  = DEMO_TEAMS;
            state.config = { nome_campeonato: 'Demo League', classificados: 4 };
            state.matches = [
                { mandante:'Flamengo',      visitante:'Palmeiras',     gols_mandante:2, gols_visitante:1, rodada:1 },
                { mandante:'Atlético-MG',   visitante:'Fluminense',    gols_mandante:0, gols_visitante:0, rodada:1 },
                { mandante:'Corinthians',   visitante:'São Paulo',     gols_mandante:3, gols_visitante:1, rodada:1 },
                { mandante:'Grêmio',        visitante:'Internacional', gols_mandante:1, gols_visitante:2, rodada:1 },
                { mandante:'Vasco',         visitante:'Botafogo',      gols_mandante:1, gols_visitante:1, rodada:1 },
                { mandante:'Santos',        visitante:'Cruzeiro',      gols_mandante:0, gols_visitante:1, rodada:1 },
                { mandante:'Palmeiras',     visitante:'Atlético-MG',   gols_mandante:1, gols_visitante:0, rodada:2 },
                { mandante:'Fluminense',    visitante:'Corinthians',   gols_mandante:2, gols_visitante:2, rodada:2 },
                { mandante:'São Paulo',     visitante:'Grêmio',        gols_mandante:1, gols_visitante:0, rodada:2 },
                { mandante:'Internacional', visitante:'Vasco',         gols_mandante:3, gols_visitante:1, rodada:2 },
                { mandante:'Botafogo',      visitante:'Santos',        gols_mandante:0, gols_visitante:2, rodada:2 },
                { mandante:'Cruzeiro',      visitante:'Flamengo',      gols_mandante:1, gols_visitante:3, rodada:2 },
            ];
            state.liveMatch = {
                mandante: 'Flamengo', visitante: 'Palmeiras',
                gols_mandante: 2, gols_visitante: 1,
                ao_vivo: true, _bracket: false,
            };
            state.knockout = [
                { fase:'quartas', ordem:1, time1:'Flamengo',     time2:'Grêmio',       gols1:2, gols2:0 },
                { fase:'quartas', ordem:2, time1:'Palmeiras',    time2:'Cruzeiro',     gols1:1, gols2:0 },
                { fase:'quartas', ordem:3, time1:'Atlético-MG',  time2:'São Paulo',    gols1:null, gols2:null },
                { fase:'quartas', ordem:4, time1:'Internacional', time2:'Botafogo',    gols1:null, gols2:null },
                // semis/3º/final são melhor de 3 sets — gols1/gols2 = sets ganhos
                { fase:'semis',   ordem:1, time1:'Flamengo',     time2:'Palmeiras',    gols1:2, gols2:1,
                  sets:[{p1:21,p2:18},{p1:19,p2:21},{p1:15,p2:13}] },
                { fase:'semis',   ordem:2, time1:'Corinthians',  time2:'Santos',       gols1:0, gols2:2,
                  sets:[{p1:18,p2:21},{p1:22,p2:24}] },
                { fase:'terceiro',ordem:1, time1:'Palmeiras',    time2:'Corinthians',  gols1:null, gols2:null, sets:[] },
                { fase:'final',   ordem:1, time1:'Flamengo',     time2:'Santos',       gols1:null, gols2:null, sets:[] },
            ];
            // simula gol a cada 8s para demonstrar atualização em tempo real
            let demoTick = 0;
            setInterval(() => {
                demoTick++;
                state.liveMatch = {
                    ...state.liveMatch,
                    gols_mandante:  2 + Math.floor(demoTick / 2),
                    gols_visitante: 1 + (demoTick % 2),
                };
                render();
            }, 8000);
            render();
        } else {

        /* ── Listeners Firebase (só quando não é demo) ── */
        onSnapshot(collection(db, 'jogos'), snap => {
            state.matches = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (a.rodada - b.rodada) || ((a.ordem||0) - (b.ordem||0)));
            const live = state.matches.find(m => m.ao_vivo);
            if (live)                       state.liveMatch = { ...live, _bracket: false };
            else if (!state.liveMatch?._bracket) state.liveMatch = null;
            render();
        });

        onSnapshot(collection(db, 'mata_mata'), snap => {
            const ord = { playin:0, quartas:1, semis:2, terceiro:3, final:4 };
            state.knockout = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (ord[a.fase]-ord[b.fase]) || ((a.ordem||0)-(b.ordem||0)));
            const live = state.knockout.find(m => m.ao_vivo);
            if (live)                      state.liveMatch = { ...live, _bracket: true };
            else if (state.liveMatch?._bracket) state.liveMatch = null;
            render();
        });

        onSnapshot(collection(db, 'times'), snap => {
            state.teams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        onSnapshot(doc(db, 'config', 'main'), snap => {
            state.config = snap.exists() ? snap.data() : {};
            render();
        });

        } // fim else DEMO

        /* ════════════════════════════════════════
           HELPERS
        ════════════════════════════════════════ */
        function teamInfo(name) {
            const t = state.teams.find(t => t.nome === name);
            return {
                name:  name  || '—',
                abbr:  t?.sigla || name?.slice(0,3).toUpperCase() || '?',
                color: t?.cor  || t?.cores?.[0] || '#555',
                cores: t?.cores || (t?.cor ? [t.cor] : ['#555']),
            };
        }

        /* SVG pill idêntico ao app (teamColorPill). inline=true remove a margem lateral */
        /* inline=true → sem margem (uso no placar)
           stretch=true → preenche 100% da altura do container (pill lateral) */
        function colorPill(cores, height = 16, inline = false, stretch = false) {
            const w = 4, n = cores.length, chamfer = 2;
            const vbH = stretch ? 100 : height;  // viewBox height fixo; SVG estira via CSS
            let segs = '';
            if (n === 1) {
                segs = `<rect x="0" y="0" width="${w}" height="${vbH}" fill="${cores[0]}"/>`;
            } else {
                const segH = vbH / n;
                cores.forEach((c, i) => {
                    const y0 = i * segH, y1 = (i + 1) * segH;
                    const tlY = i === 0 ? y0 : y0 + chamfer;
                    const trY = i === 0 ? y0 : y0 - chamfer;
                    const blY = i === n-1 ? y1 : y1 + chamfer;
                    const brY = i === n-1 ? y1 : y1 - chamfer;
                    segs += `<polygon points="0,${tlY} ${w},${trY} ${w},${brY} 0,${blY}" fill="${c}"/>`;
                });
            }
            const margin = inline ? '0' : '6px';
            const hAttr  = stretch ? '100%' : height;
            const vbAttr = stretch ? `viewBox="0 0 ${w} ${vbH}" preserveAspectRatio="none"` : '';
            const style  = stretch
                ? `align-self:stretch;flex-shrink:0;margin-right:${margin};overflow:hidden;border-radius:0`
                : `border-radius:2px;vertical-align:middle;flex-shrink:0;margin-right:${margin};overflow:hidden`;
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${hAttr}" ${vbAttr} style="${style}">${segs}</svg>`;
        }

        function hex2rgba(hex, a) {
            if (!hex || hex.length < 7) return `rgba(80,80,80,${a})`;
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            return `rgba(${r},${g},${b},${a})`;
        }

        function scoreOf(m) {
            if (!m._bracket) return { h: m.gols_mandante ?? 0, a: m.gols_visitante ?? 0 };
            if (isSetPhase(m.fase)) {
                const s = setsSummary(m);
                if (s.list.length) return { h: s.won1, a: s.won2 };
            }
            return { h: m.gols1 ?? 0, a: m.gols2 ?? 0 };
        }

        function namesOf(m) {
            return m._bracket
                ? { home: m.time1, away: m.time2 }
                : { home: m.mandante, away: m.visitante };
        }

        function phaseName(f) {
            return { playin:'Play-In', quartas:'Quartas de Final', semis:'Semifinais', terceiro:'Disputa de 3º Lugar', final:'Final' }[f] || f;
        }

        function calcStandings() {
            const stats = {};
            state.teams.forEach(t => {
                stats[t.nome] = {
                    name: t.nome,
                    abbr: t.sigla || t.nome?.slice(0,3).toUpperCase() || '?',
                    color: t.cor || t.cores?.[0] || '#555',
                    cores: t.cores || (t.cor ? [t.cor] : ['#555']),
                    pts:0, played:0, wins:0, draws:0, losses:0,
                    tbWins:0, tbLosses:0, gf:0, ga:0,
                };
            });
            state.matches.forEach(m => {
                if (m.gols_mandante == null || m.gols_visitante == null || m.ao_vivo) return;
                const h = stats[m.mandante], a = stats[m.visitante];
                if (!h || !a) return;
                h.played++; a.played++;
                h.gf += m.gols_mandante; h.ga += m.gols_visitante;
                a.gf += m.gols_visitante; a.ga += m.gols_mandante;
                if (m.gols_mandante > m.gols_visitante)
                    m.tiebreak ? (h.tbWins++, h.pts+=2, a.tbLosses++, a.pts+=1) : (h.wins++, h.pts+=3, a.losses++);
                else if (m.gols_mandante < m.gols_visitante)
                    m.tiebreak ? (a.tbWins++, a.pts+=2, h.tbLosses++, h.pts+=1) : (a.wins++, a.pts+=3, h.losses++);
                else { h.draws++; h.pts++; a.draws++; a.pts++; }
            });
            return Object.values(stats).sort((a,b) => {
                if (b.pts  !== a.pts)  return b.pts  - a.pts;
                if (b.wins !== a.wins) return b.wins - a.wins;
                if ((b.gf-b.ga) !== (a.gf-a.ga)) return (b.gf-b.ga)-(a.gf-a.ga);
                return b.gf - a.gf;
            });
        }

        /* ════════════════════════════════════════
           RENDER
        ════════════════════════════════════════ */
        function render() {
            document.getElementById('app').innerHTML =
                ({ mini: renderMini, corner: renderCorner, full: renderFull, table: renderTable }[MODE] ?? renderMini)();
        }

        /* ─── MINI — só placar ─── */
        function renderMini() {
            const lm = state.liveMatch;
            if (!lm) return `<div class="mini-no-live">Nenhum jogo ao vivo</div>`;

            const { h, a }       = scoreOf(lm);
            const { home, away } = namesOf(lm);
            const ti = teamInfo(home), ai = teamInfo(away);

            return `
                <div class="mini-card">
                    ${colorPill(ti.cores, 44, true, true)}
                    <div class="mini-team-block">
                        <span class="mini-abbr">${ti.abbr}</span>
                        <span class="mini-name">${ti.name}</span>
                    </div>
                    <div class="mini-center-block">
                        <div class="mini-digits">${h} × ${a}</div>
                        <div class="live-dot">● AO VIVO</div>
                    </div>
                    <div class="mini-team-block right">
                        <span class="mini-abbr">${ai.abbr}</span>
                        <span class="mini-name">${ai.name}</span>
                    </div>
                    ${colorPill(ai.cores, 44, true, true)}
                </div>
            `;
        }

        /* ─── CORNER — só tabela ─── */
        function renderCorner() {
            const champName = state.config.nome_campeonato || '';
            const classif   = state.config.classificados  || 4;
            const rows = TABLE === 'bracket' ? cornerBracket() : cornerStandings(classif);

            return `
                <div class="corner-wrap">
                    <div class="corner-panel">
                        <div class="c-thead">
                            <span class="c-th">POS</span>
                            <span class="c-th left">TIME</span>
                            <span class="c-th">STATUS</span>
                            <span class="c-th">V</span>
                            <span class="c-th right">PTS</span>
                        </div>
                        ${rows}
                        <div class="panel-footer">● LIVE RANKING${champName ? ' — ' + champName : ''}</div>
                    </div>
                </div>
            `;
        }

        function recentResults(teamName) {
            /* últimos 5 jogos finalizados desse time */
            const done = state.matches
                .filter(m => !m.ao_vivo && m.gols_mandante != null && m.gols_visitante != null
                    && (m.mandante === teamName || m.visitante === teamName))
                .slice(-5);
            return done.map(m => {
                const isHome = m.mandante === teamName;
                const gf = isHome ? m.gols_mandante : m.gols_visitante;
                const ga = isHome ? m.gols_visitante : m.gols_mandante;
                if (gf > ga) return 'W';
                if (gf < ga) return 'L';
                return 'D';
            });
        }

        function cornerStandings(classif) {
            const list = calcStandings().slice(0, MAX_ROWS);
            if (!list.length) return `<div style="padding:14px;text-align:center;font-size:11px;color:#8b949e">Sem dados</div>`;
            return list.map((t, i) => {
                const isQ  = i < classif;
                const isPi = !isQ && i < 12;
                const isOut= !isQ && !isPi;
                const isQBorder  = i === classif - 1;
                const isPiBorder = i === 11;

                const zoneClass = isQ ? 'zone-q' : isPi ? 'zone-pi' : 'zone-out';
                const borderClass = isQBorder ? 'zone-q-border' : isPiBorder ? 'zone-pi-border' : '';
                const posClass = isQ ? 'q' : isPi ? 'pi' : 'out';

                const results = recentResults(t.name);
                const bars = Array(5).fill(null).map((_, j) => {
                    const r = results[j];
                    let bg;
                    if      (!r)       bg = '#21262d';
                    else if (r === 'W') bg = t.color;
                    else if (r === 'D') bg = '#8b949e';
                    else                bg = '#30363d';
                    return `<div class="c-bar" style="background:${bg}"></div>`;
                }).join('');

                return `
                    <div class="c-row ${zoneClass} ${borderClass}">
                        <div class="c-pos ${posClass}">${i+1}</div>
                        <div class="c-team">
                            ${colorPill(t.cores, 16)}
                            <span class="c-name">${t.name}</span>
                        </div>
                        <div class="c-status">${bars}</div>
                        <div class="c-num">${t.wins}</div>
                        <div class="c-pts-val">${t.pts}</div>
                    </div>
                `;
            }).join('');
        }

        function cornerBracket(classif) {
            const phases = ['final','terceiro','semis','quartas','playin'];
            for (const fase of phases) {
                const ms = state.knockout.filter(m => m.fase === fase && (m.time1 || m.time2));
                if (!ms.length) continue;
                return ms.slice(0, MAX_ROWS).map(m => {
                    const ti = teamInfo(m.time1), ai = teamInfo(m.time2);
                    const sets = isSetPhase(m.fase) ? setsSummary(m) : null;
                    const s1 = sets && sets.list.length ? sets.won1 : (m.gols1 ?? '–');
                    const s2 = sets && sets.list.length ? sets.won2 : (m.gols2 ?? '–');
                    return `
                        <div class="c-row">
                            <div class="c-flag" style="background:${ti.color}"></div>
                            <div class="c-name" style="flex:1">${ti.abbr}</div>
                            <div class="c-pts">${s1}×${s2}</div>
                            <div class="c-name" style="flex:1;text-align:right">${ai.abbr}</div>
                            <div class="c-flag" style="background:${ai.color}"></div>
                        </div>`;
                }).join('');
            }
            return `<div style="padding:14px;text-align:center;font-size:11px;color:rgba(255,255,255,0.2)">Bracket vazio</div>`;
        }

        /* ─── FULL — placar + tabela ─── */
        function renderFull() {
            const lm        = state.liveMatch;
            const champName = state.config.nome_campeonato || 'Campeonato';
            const classif   = state.config.classificados  || 4;

            const scoreBlock = (() => {
                if (!lm) return `<div class="full-awaiting">Aguardando jogo ao vivo…</div>`;
                const { h, a }       = scoreOf(lm);
                const { home, away } = namesOf(lm);
                const ti = teamInfo(home), ai = teamInfo(away);
                const sets = lm._bracket && isSetPhase(lm.fase) ? setsSummary(lm) : null;
                const pen = sets && sets.list.length
                    ? `<div class="full-pen">Sets: ${sets.text}</div>`
                    : (lm._bracket && (lm.pen1 != null || lm.pen2 != null)
                        ? `<div class="full-pen">Pênaltis: ${lm.pen1 ?? 0} × ${lm.pen2 ?? 0}</div>` : '');
                return `
                    <div class="full-scoreboard">
                        ${colorPill(ti.cores, 130, true, true)}
                        <div class="full-team-block right">
                            <div class="full-team-abbr">${ti.abbr}</div>
                            <div class="full-team-name">${ti.name}</div>
                        </div>
                        <div class="full-score-mid">
                            <div class="full-digits">
                                <span>${h}</span>
                                <span class="full-sep">×</span>
                                <span>${a}</span>
                            </div>
                            <span class="full-live-badge">🔴 AO VIVO</span>
                            ${pen}
                        </div>
                        <div class="full-team-block">
                            <div class="full-team-abbr">${ai.abbr}</div>
                            <div class="full-team-name">${ai.name}</div>
                        </div>
                        ${colorPill(ai.cores, 130, true, true)}
                    </div>
                `;
            })();

            const tableLabel   = TABLE === 'bracket' ? '🏆 Chaveamento' : '📊 Classificação';
            const tableContent = TABLE === 'bracket' ? fullBracket() : fullStandings(classif);

            return `
                <div class="full-wrap">
                    ${scoreBlock}
                    <div class="full-table-wrap">
                        <div class="full-table-header">
                            <span>${tableLabel}</span>
                            <span style="color:rgba(255,255,255,0.15);font-size:9px;font-style:italic">${champName}</span>
                        </div>
                        ${tableContent}
                    </div>
                </div>
            `;
        }

        function fullStandings(classif) {
            const list = calcStandings();
            if (!list.length) return `<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.15);font-style:italic">Sem dados</div>`;
            const rows = list.map((t, i) => {
                const zone = i < classif ? 'zone-q' : (i < 12 ? 'zone-pi' : '');
                const sg   = t.gf - t.ga;
                return `
                    <tr class="${zone}">
                        <td class="muted">${i+1}</td>
                        <td class="tleft">
                            <span class="t-flag" style="background:${t.color}"></span>
                            <span class="t-name">${t.name}</span>
                        </td>
                        <td class="muted">${t.played}</td>
                        <td>${t.wins}</td>
                        <td class="muted">${t.draws}</td>
                        <td class="muted">${t.losses}</td>
                        <td>${t.gf}</td>
                        <td class="muted">${t.ga}</td>
                        <td>${sg>0?'+':''}${sg}</td>
                        <td class="t-pts" style="color:${t.color}">${t.pts}</td>
                    </tr>
                `;
            }).join('');
            return `
                <table>
                    <thead>
                        <tr>
                            <th>#</th><th class="tleft">Time</th>
                            <th title="Partidas">PJ</th><th title="Vitórias">V</th>
                            <th title="Empates">E</th><th title="Derrotas">D</th>
                            <th title="Gols Pró">GP</th><th title="Gols Contra">GC</th>
                            <th title="Saldo">SG</th><th title="Pontos">P</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function fullBracket() {
            if (!state.knockout.some(m => m.time1 || m.time2))
                return `<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.15);font-style:italic">Chaveamento não iniciado</div>`;

            const html = ['playin','quartas','semis','terceiro','final'].map(fase => {
                const ms = state.knockout.filter(m => m.fase === fase);
                if (!ms.length) return '';
                const cols = Math.min(ms.length, 2);
                const cards = ms.map(m => {
                    const ti = teamInfo(m.time1), ai = teamInfo(m.time2);
                    const sets = isSetPhase(m.fase) ? setsSummary(m) : null;
                    const s1 = sets && sets.list.length ? sets.won1 : m.gols1;
                    const s2 = sets && sets.list.length ? sets.won2 : m.gols2;
                    const has = s1 != null && s2 != null;
                    // em partidas por set só destaca o vencedor quando alguém leva 2 sets
                    const decided = sets && sets.list.length ? (sets.won1 >= 2 || sets.won2 >= 2) : has;
                    const w1  = decided && s1 > s2;
                    const w2  = decided && s2 > s1;
                    return `
                        <div class="bm">
                            <div class="bm-team" style="background:${hex2rgba(ti.color,0.08)}">
                                <div class="bm-flag" style="background:${ti.color}"></div>
                                <span class="${w1?'winner-text':''}">${ti.name}</span>
                            </div>
                            <div class="bm-score">${has ? `${s1} × ${s2}` : 'vs'}</div>
                            <div class="bm-team right" style="background:${hex2rgba(ai.color,0.08)}">
                                <span class="${w2?'winner-text':''}">${ai.name}</span>
                                <div class="bm-flag" style="background:${ai.color}"></div>
                            </div>
                        </div>`;
                }).join('');
                return `
                    <div>
                        <div class="bracket-phase-label">${phaseName(fase)}</div>
                        <div class="bracket-grid" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div>
                    </div>`;
            }).join('');

            return `<div class="bracket-wrap">${html}</div>`;
        }

        /* ─── TABLE — só a tabela, sem placar ─── */
        function renderTable() {
            const champName = state.config.nome_campeonato || 'Campeonato';
            const classif   = state.config.classificados  || 4;
            const tableLabel   = TABLE === 'bracket' ? '🏆 Chaveamento' : '📊 Classificação';
            const tableContent = TABLE === 'bracket' ? fullBracket() : fullStandings(classif);
            return `
                <div class="table-wrap">
                    <div class="full-table-wrap">
                        <div class="full-table-header">
                            <span>${tableLabel}</span>
                            <span style="color:rgba(255,255,255,0.15);font-size:9px;font-style:italic">${champName}</span>
                        </div>
                        ${tableContent}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>
</html>
