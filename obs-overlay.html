<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Overlay – Campeonato</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* ══════════════════════════════════════════════
           MODO MINI  ?mode=mini
           Só o placar ao vivo.
           Tamanho OBS sugerido: 600 × 80
        ══════════════════════════════════════════════ */
        body.mode-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .mini-wrap {
            display: flex;
            align-items: stretch;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            min-width: 420px;
            height: 72px;
        }

        .mini-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 18px;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        .mini-side.home { justify-content: flex-end; }
        .mini-side.away { justify-content: flex-start; }

        .mini-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            padding: 0 20px;
            flex-shrink: 0;
            gap: 4px;
        }

        .mini-score-digits {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;
        }

        .live-dot {
            font-size: 9px;
            font-weight: 700;
            color: #fc8181;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }

        .mini-no-live {
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            padding: 16px 28px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            font-style: italic;
        }

        /* ══════════════════════════════════════════════
           MODO CORNER  ?mode=corner
           Placar compacto + classificação resumida, num canto.
           Tamanho OBS sugerido: 340 × 560
        ══════════════════════════════════════════════ */
        body.mode-corner {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            width: 100vw;
            height: 100vh;
            padding: 14px;
        }

        .corner-wrap {
            width: 312px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* placar corner */
        .corner-score {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 20px rgba(0,0,0,0.5);
        }

        .corner-score-teams {
            display: flex;
            height: 58px;
        }

        .corner-score-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .corner-score-abbr {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
        }

        .corner-score-name {
            font-size: 9px;
            font-weight: 600;
            opacity: 0.75;
            margin-top: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .corner-score-mid {
            background: rgba(0,0,0,0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            flex-shrink: 0;
            gap: 3px;
        }

        .corner-score-nums {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
        }

        .corner-live-dot {
            font-size: 8px;
            font-weight: 700;
            color: #fc8181;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }

        .corner-score-footer {
            background: rgba(0,0,0,0.65);
            text-align: center;
            font-size: 9px;
            color: rgba(255,255,255,0.35);
            padding: 4px;
        }

        /* tabela corner */
        .corner-table-wrap {
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .corner-table-header {
            padding: 8px 12px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .corner-row {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
            gap: 8px;
        }

        .corner-row.zone-q  { background: rgba(72,187,120,0.07); }
        .corner-row.zone-pi { background: rgba(246,173,85,0.05); }

        .c-swatch {
            width: 3px;
            height: 22px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .c-pos {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            width: 14px;
            text-align: right;
            flex-shrink: 0;
        }

        .c-abbr {
            font-size: 12px;
            font-weight: 800;
            flex: 1;
        }

        .c-pts {
            font-size: 13px;
            font-weight: 900;
        }

        .c-pj {
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            width: 20px;
            text-align: right;
        }

        /* ══════════════════════════════════════════════
           MODO FULL  ?mode=full
           Placar grande + tabela completa centralizado.
           Tamanho OBS sugerido: 900 × 700 (ou 1920×1080)
        ══════════════════════════════════════════════ */
        body.mode-full {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        .full-wrap {
            width: min(880px, 96vw);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .full-champ-label {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
        }

        /* placar full */
        .full-scoreboard {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 40px rgba(0,0,0,0.6);
            display: flex;
            height: 150px;
        }

        .full-team-side {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 32px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .full-team-side.home { justify-content: flex-end; }
        .full-team-side.away { justify-content: flex-start; }

        .full-team-info {
            display: flex;
            flex-direction: column;
            align-items: inherit;
            gap: 4px;
        }

        .full-team-abbr {
            font-size: 36px;
            font-weight: 900;
            line-height: 1;
        }

        .full-team-name {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.75;
        }

        .full-score-mid {
            background: rgba(0,0,0,0.82);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 36px;
            flex-shrink: 0;
            gap: 6px;
        }

        .full-score-nums {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .full-score-n {
            font-size: 68px;
            font-weight: 900;
            line-height: 1;
        }

        .full-score-sep {
            font-size: 36px;
            font-weight: 300;
            color: rgba(255,255,255,0.3);
        }

        .full-live-badge {
            background: #c53030;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 5px;
            letter-spacing: 2px;
            animation: blink 1.5s infinite;
        }

        .full-pen-info {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
        }

        .full-awaiting {
            background: rgba(0,0,0,0.7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 110px;
            color: rgba(255,255,255,0.2);
            font-size: 14px;
            font-style: italic;
        }

        /* tabela full */
        .full-table-wrap {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .full-table-header {
            padding: 11px 18px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            padding: 8px 12px;
            text-align: center;
            font-size: 9px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        thead th.tleft { text-align: left; }

        tbody tr { border-top: 1px solid rgba(255,255,255,0.04); }
        tbody tr.zone-q  { background: rgba(72,187,120,0.07); }
        tbody tr.zone-pi { background: rgba(246,173,85,0.05); }

        tbody td {
            padding: 7px 12px;
            text-align: center;
        }

        tbody td.tleft { text-align: left; }
        tbody td.muted { color: rgba(255,255,255,0.35); }

        .t-swatch {
            display: inline-block;
            width: 3px;
            height: 16px;
            border-radius: 2px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .t-name { font-weight: 700; vertical-align: middle; }
        .t-pts  { font-weight: 900; font-size: 15px; }

        /* bracket full */
        .bracket-wrap { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }

        .bracket-phase-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 7px;
        }

        .bracket-grid { display: grid; gap: 6px; }

        .bm {
            display: flex;
            align-items: center;
            border-radius: 7px;
            overflow: hidden;
            font-size: 13px;
            background: rgba(255,255,255,0.04);
        }

        .bm-team {
            flex: 1;
            padding: 8px 12px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bm-team.right { flex-direction: row-reverse; }
        .bm-team.winner { color: #68d391; }

        .bm-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .bm-score {
            background: rgba(255,255,255,0.09);
            padding: 8px 16px;
            font-weight: 900;
            font-size: 15px;
            min-width: 60px;
            text-align: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getFirestore, collection,
                 doc, onSnapshot }        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        /* ── Firebase ── */
        const firebaseConfig = {
            apiKey:            'AIzaSyDKPy8Q8BNGUqGZ-DFIGyjguS7ZD_r9V8Q',
            authDomain:        'organizador-de-campeonato.firebaseapp.com',
            projectId:         'organizador-de-campeonato',
            storageBucket:     'organizador-de-campeonato.firebasestorage.app',
            messagingSenderId: '574392149055',
            appId:             '1:574392149055:web:75225d6719270b6b4dc48a',
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        /* ── URL params ── */
        const params   = new URLSearchParams(location.search);
        const MODE     = params.get('mode') || 'mini';   // mini | corner | full
        const TABLE    = params.get('table') || 'standings'; // standings | bracket
        const MAX_ROWS = parseInt(params.get('rows') || '8', 10);

        document.body.classList.add('mode-' + MODE);

        /* ── State ── */
        const state = {
            liveMatch: null,
            matches:   [],
            knockout:  [],
            teams:     [],
            config:    {},
        };

        /* ── Listeners ── */
        onSnapshot(collection(db, 'jogos'), snap => {
            state.matches = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (a.rodada - b.rodada) || ((a.ordem || 0) - (b.ordem || 0)));

            const live = state.matches.find(m => m.ao_vivo);
            if (live) state.liveMatch = { ...live, _bracket: false };
            else if (!state.liveMatch?._bracket) state.liveMatch = null;
            render();
        });

        onSnapshot(collection(db, 'mata_mata'), snap => {
            const order = { playin: 0, quartas: 1, semis: 2, final: 3 };
            state.knockout = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (order[a.fase] - order[b.fase]) || ((a.ordem || 0) - (b.ordem || 0)));

            const live = state.knockout.find(m => m.ao_vivo);
            if (live) state.liveMatch = { ...live, _bracket: true };
            else if (state.liveMatch?._bracket) state.liveMatch = null;
            render();
        });

        onSnapshot(collection(db, 'times'), snap => {
            state.teams = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        onSnapshot(doc(db, 'config', 'main'), snap => {
            state.config = snap.exists() ? snap.data() : {};
            render();
        });

        /* ════════════════════════════════════════
           HELPERS
        ════════════════════════════════════════ */
        function teamInfo(name) {
            const t = state.teams.find(t => t.nome === name);
            return {
                name:  name || '—',
                abbr:  t?.sigla  || name?.slice(0, 3).toUpperCase() || '?',
                color: t?.cor    || (t?.cores?.[0]) || '#555',
                cores: t?.cores  || (t?.cor ? [t.cor] : ['#555']),
            };
        }

        function gradient(cores) {
            if (!cores || cores.length < 2) return cores?.[0] || '#333';
            return `linear-gradient(135deg, ${cores.join(', ')})`;
        }

        function hex2rgba(hex, a = 0.25) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r},${g},${b},${a})`;
        }

        function scoreOf(m) {
            return m._bracket
                ? { h: m.gols1 ?? 0, a: m.gols2 ?? 0 }
                : { h: m.gols_mandante ?? 0, a: m.gols_visitante ?? 0 };
        }

        function namesOf(m) {
            return m._bracket
                ? { home: m.time1, away: m.time2 }
                : { home: m.mandante, away: m.visitante };
        }

        function phaseName(f) {
            return { playin: 'Play-In', quartas: 'Quartas de Final', semis: 'Semifinais', final: 'Final' }[f] || f;
        }

        /* ── Classificação ── */
        function calcStandings() {
            const stats = {};
            state.teams.forEach(t => {
                stats[t.nome] = {
                    name: t.nome,
                    abbr: t.sigla || t.nome?.slice(0,3).toUpperCase() || '?',
                    color: t.cor || t.cores?.[0] || '#555',
                    pts: 0, played: 0,
                    wins: 0, draws: 0, losses: 0,
                    tbWins: 0, tbLosses: 0,
                    gf: 0, ga: 0,
                };
            });

            state.matches.forEach(m => {
                if (m.gols_mandante == null || m.gols_visitante == null || m.ao_vivo) return;
                const h = stats[m.mandante], a = stats[m.visitante];
                if (!h || !a) return;
                h.played++; a.played++;
                h.gf += m.gols_mandante; h.ga += m.gols_visitante;
                a.gf += m.gols_visitante; a.ga += m.gols_mandante;
                if (m.gols_mandante > m.gols_visitante) {
                    m.tiebreak ? (h.tbWins++, h.pts+=2, a.tbLosses++, a.pts+=1) : (h.wins++, h.pts+=3, a.losses++);
                } else if (m.gols_mandante < m.gols_visitante) {
                    m.tiebreak ? (a.tbWins++, a.pts+=2, h.tbLosses++, h.pts+=1) : (a.wins++, a.pts+=3, h.losses++);
                } else {
                    h.draws++; h.pts++; a.draws++; a.pts++;
                }
            });

            return Object.values(stats).sort((a, b) => {
                if (b.pts  !== a.pts)  return b.pts  - a.pts;
                if (b.wins !== a.wins) return b.wins - a.wins;
                if ((b.gf-b.ga) !== (a.gf-a.ga)) return (b.gf-b.ga) - (a.gf-a.ga);
                return b.gf - a.gf;
            });
        }

        /* ════════════════════════════════════════
           RENDER
        ════════════════════════════════════════ */
        function render() {
            document.getElementById('app').innerHTML = {
                mini:   renderMini,
                corner: renderCorner,
                full:   renderFull,
            }[MODE]?.() ?? renderMini();
        }

        /* ─── MINI ─── */
        function renderMini() {
            const lm = state.liveMatch;
            if (!lm) return `<div class="mini-no-live">Nenhum jogo ao vivo</div>`;

            const { h, a }     = scoreOf(lm);
            const { home, away } = namesOf(lm);
            const ti = teamInfo(home), ai = teamInfo(away);

            return `
                <div class="mini-wrap">
                    <div class="mini-side home"
                         style="background:${gradient(ti.cores)}; text-shadow:0 1px 5px rgba(0,0,0,0.6)">
                        ${ti.abbr}
                    </div>
                    <div class="mini-center">
                        <div class="mini-score-digits">${h} × ${a}</div>
                        <div class="live-dot">● AO VIVO</div>
                    </div>
                    <div class="mini-side away"
                         style="background:${gradient(ai.cores)}; text-shadow:0 1px 5px rgba(0,0,0,0.6)">
                        ${ai.abbr}
                    </div>
                </div>
            `;
        }

        /* ─── CORNER ─── */
        function renderCorner() {
            const lm  = state.liveMatch;
            const classif = state.config.classificados || 4;
            const standings = calcStandings().slice(0, MAX_ROWS);

            const scoreBlock = (() => {
                if (!lm) return `
                    <div class="corner-score" style="background:rgba(0,0,0,0.7)">
                        <div style="padding:14px;text-align:center;font-size:11px;color:rgba(255,255,255,0.25);font-style:italic">
                            Aguardando jogo…
                        </div>
                    </div>`;

                const { h, a }       = scoreOf(lm);
                const { home, away } = namesOf(lm);
                const ti = teamInfo(home), ai = teamInfo(away);
                const pen = lm._bracket && (lm.pen1 != null || lm.pen2 != null)
                    ? `<div class="corner-score-footer">Pênaltis: ${lm.pen1 ?? 0} × ${lm.pen2 ?? 0}</div>` : '';

                return `
                    <div class="corner-score">
                        <div class="corner-score-teams">
                            <div class="corner-score-side"
                                 style="background:${gradient(ti.cores)}">
                                <div class="corner-score-abbr">${ti.abbr}</div>
                                <div class="corner-score-name">${ti.name}</div>
                            </div>
                            <div class="corner-score-mid">
                                <div class="corner-score-nums">${h} × ${a}</div>
                                <div class="corner-live-dot">● AO VIVO</div>
                            </div>
                            <div class="corner-score-side"
                                 style="background:${gradient(ai.cores)}">
                                <div class="corner-score-abbr">${ai.abbr}</div>
                                <div class="corner-score-name">${ai.name}</div>
                            </div>
                        </div>
                        ${pen}
                    </div>
                `;
            })();

            const tableLabel = TABLE === 'bracket' ? '🏆 Chaveamento' : '📊 Classificação';
            const tableRows  = TABLE === 'bracket'
                ? cornerBracket()
                : standings.map((t, i) => {
                    const zone = i < classif ? 'zone-q' : (i < 12 ? 'zone-pi' : '');
                    return `
                        <div class="corner-row ${zone}">
                            <div class="c-swatch" style="background:${t.color}"></div>
                            <div class="c-pos">${i+1}</div>
                            <div class="c-abbr" style="color:${t.color}">${t.abbr}</div>
                            <div style="flex:1"></div>
                            <div class="c-pj">${t.played}j</div>
                            <div class="c-pts" style="color:${t.color}">${t.pts}p</div>
                        </div>
                    `;
                  }).join('');

            return `
                <div class="corner-wrap">
                    ${scoreBlock}
                    <div class="corner-table-wrap">
                        <div class="corner-table-header">${tableLabel}</div>
                        ${tableRows}
                    </div>
                </div>
            `;
        }

        function cornerBracket() {
            const phases = ['final','semis','quartas','playin'];
            for (const fase of phases) {
                const ms = state.knockout.filter(m => m.fase === fase && (m.time1 || m.time2));
                if (!ms.length) continue;
                return ms.slice(0, MAX_ROWS).map(m => {
                    const ti = teamInfo(m.time1), ai = teamInfo(m.time2);
                    const s1 = m.gols1 ?? '–', s2 = m.gols2 ?? '–';
                    return `
                        <div class="corner-row">
                            <div class="c-swatch" style="background:${ti.color}"></div>
                            <div class="c-abbr" style="color:${ti.color};flex:1">${ti.abbr}</div>
                            <div class="c-pts">${s1}×${s2}</div>
                            <div class="c-abbr" style="color:${ai.color};flex:1;text-align:right">${ai.abbr}</div>
                            <div class="c-swatch" style="background:${ai.color}"></div>
                        </div>`;
                }).join('');
            }
            return `<div style="padding:12px;font-size:11px;color:rgba(255,255,255,0.25);text-align:center">Bracket vazio</div>`;
        }

        /* ─── FULL ─── */
        function renderFull() {
            const lm        = state.liveMatch;
            const champName = state.config.nome_campeonato || 'Campeonato';
            const classif   = state.config.classificados  || 4;

            const scoreBlock = (() => {
                if (!lm) return `<div class="full-awaiting">Aguardando jogo ao vivo…</div>`;

                const { h, a }       = scoreOf(lm);
                const { home, away } = namesOf(lm);
                const ti = teamInfo(home), ai = teamInfo(away);
                const pen = lm._bracket && (lm.pen1 != null || lm.pen2 != null)
                    ? `<div class="full-pen-info">Pênaltis: ${lm.pen1 ?? 0} × ${lm.pen2 ?? 0}</div>` : '';

                return `
                    <div class="full-scoreboard">
                        <div class="full-team-side home"
                             style="background:${gradient(ti.cores)}; justify-content:flex-end">
                            <div class="full-team-info" style="align-items:flex-end">
                                <div class="full-team-abbr">${ti.abbr}</div>
                                <div class="full-team-name">${ti.name}</div>
                            </div>
                        </div>
                        <div class="full-score-mid">
                            <div class="full-score-nums">
                                <span class="full-score-n">${h}</span>
                                <span class="full-score-sep">×</span>
                                <span class="full-score-n">${a}</span>
                            </div>
                            <span class="full-live-badge">🔴 AO VIVO</span>
                            ${pen}
                        </div>
                        <div class="full-team-side away"
                             style="background:${gradient(ai.cores)}">
                            <div class="full-team-info" style="align-items:flex-start">
                                <div class="full-team-abbr">${ai.abbr}</div>
                                <div class="full-team-name">${ai.name}</div>
                            </div>
                        </div>
                    </div>
                `;
            })();

            const tableLabel  = TABLE === 'bracket' ? '🏆 Chaveamento' : '📊 Classificação';
            const tableContent = TABLE === 'bracket' ? fullBracket() : fullStandings(classif);

            return `
                <div class="full-wrap">
                    <div class="full-champ-label">${champName}</div>
                    ${scoreBlock}
                    <div class="full-table-wrap">
                        <div class="full-table-header">${tableLabel}</div>
                        ${tableContent}
                    </div>
                </div>
            `;
        }

        function fullStandings(classif) {
            const standings = calcStandings();
            if (!standings.length) return `<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.2);font-style:italic">Sem dados</div>`;

            const rows = standings.map((t, i) => {
                const zone = i < classif ? 'zone-q' : (i < 12 ? 'zone-pi' : '');
                const sg   = t.gf - t.ga;
                return `
                    <tr class="${zone}">
                        <td class="muted">${i+1}</td>
                        <td class="tleft">
                            <span class="t-swatch" style="background:${t.color}"></span>
                            <span class="t-name" style="color:${t.color}">${t.name}</span>
                        </td>
                        <td class="muted">${t.played}</td>
                        <td>${t.wins}</td>
                        <td class="muted">${t.draws}</td>
                        <td class="muted">${t.losses}</td>
                        <td>${t.gf}</td>
                        <td class="muted">${t.ga}</td>
                        <td>${sg > 0 ? '+' : ''}${sg}</td>
                        <td class="t-pts" style="color:${t.color}">${t.pts}</td>
                    </tr>
                `;
            }).join('');

            return `
                <table>
                    <thead>
                        <tr>
                            <th>#</th><th class="tleft">Time</th>
                            <th title="Partidas Jogadas">PJ</th>
                            <th title="Vitórias">V</th>
                            <th title="Empates">E</th>
                            <th title="Derrotas">D</th>
                            <th title="Gols Pró">GP</th>
                            <th title="Gols Contra">GC</th>
                            <th title="Saldo">SG</th>
                            <th title="Pontos">P</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function fullBracket() {
            const phases = ['playin','quartas','semis','final'];
            if (!state.knockout.some(m => m.time1 || m.time2))
                return `<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.2);font-style:italic">Chaveamento não iniciado</div>`;

            const html = phases.map(fase => {
                const ms = state.knockout.filter(m => m.fase === fase);
                if (!ms.length) return '';
                const cols = Math.min(ms.length, 2);

                const cards = ms.map(m => {
                    const ti = teamInfo(m.time1), ai = teamInfo(m.time2);
                    const hasScore = m.gols1 != null && m.gols2 != null;
                    const w1 = hasScore && m.gols1 > m.gols2;
                    const w2 = hasScore && m.gols2 > m.gols1;
                    const score = hasScore ? `${m.gols1} × ${m.gols2}` : 'vs';
                    return `
                        <div class="bm">
                            <div class="bm-team ${w1 ? 'winner' : ''}" style="background:${hex2rgba(ti.color,0.12)}">
                                <div class="bm-dot" style="background:${ti.color}"></div>
                                <span style="color:${w1 ? '#68d391' : '#fff'}">${ti.name}</span>
                            </div>
                            <div class="bm-score">${score}</div>
                            <div class="bm-team right ${w2 ? 'winner' : ''}" style="background:${hex2rgba(ai.color,0.12)}">
                                <span style="color:${w2 ? '#68d391' : '#fff'}">${ai.name}</span>
                                <div class="bm-dot" style="background:${ai.color}"></div>
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div>
                        <div class="bracket-phase-label">${phaseName(fase)}</div>
                        <div class="bracket-grid" style="grid-template-columns:repeat(${cols},1fr)">${cards}</div>
                    </div>
                `;
            }).join('');

            return `<div class="bracket-wrap">${html}</div>`;
        }

        render();
    </script>
</body>
</html>
